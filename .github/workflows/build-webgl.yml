name: Build and Deploy WebGL

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Unity WebGL build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Enable WebGL decompression fallback
        run: |
          sed -i 's/webGLDecompressionFallback: 0/webGLDecompressionFallback: 1/' ProjectSettings/ProjectSettings.asset
          grep 'webGLDecompressionFallback' ProjectSettings/ProjectSettings.asset

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: Builds
          buildName: WebGL
          allowDirtyBuild: true

      - name: Upload downloadable WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: mergeur-webgl-${{ github.sha }}
          path: Builds/WebGL
          if-no-files-found: error
          retention-days: 14

      - name: Verify GitHub Pages root
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: test -f Builds/WebGL/WebGL/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL/WebGL

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-webgl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
