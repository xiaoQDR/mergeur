name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Unity Android APK
    # Rive Unity v0.4.2+ ships a Linux editor native library that requires
    # GLIBC 2.38, while GameCI's Ubuntu Unity images currently use glibc 2.35.
    # Build on Windows so Unity imports .riv assets with Rive's Windows editor
    # plugin, while still targeting Android for the final player build.
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildsPath: Builds
          buildName: mergeur
          customImage: unityci/editor:windows-6000.3.23f1-android-3.2.2
          dockerIsolationMode: process

      - name: Show Android build output
        shell: pwsh
        run: |
          if (Test-Path "Builds") {
            Get-ChildItem -Path "Builds" -Recurse -File | ForEach-Object { $_.FullName }
          } else {
            Write-Host "Builds directory does not exist."
          }

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path "Builds" -Recurse -Filter "*.apk" -File | Select-Object -First 1
          if (-not $apk) {
            throw "No APK was produced."
          }
          "APK_PATH=$($apk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "APK: $($apk.FullName)"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mergeur-android-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
